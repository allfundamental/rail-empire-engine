name: Build OpenTTD Browser Game

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-24.04

    container:
      image: emscripten/emsdk:6.0.1

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Allow workspace ownership
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install OpenTTD liblzma Emscripten port
        run: |
          cp os/emscripten/ports/liblzma.py \
            /emsdk/upstream/emscripten/tools/ports/contrib/

      - name: Compile native host tools
        run: |
          cmake -S . -B build-host \
            -DOPTION_TOOLS_ONLY=ON \
            -DCMAKE_BUILD_TYPE=Release

          cmake --build build-host --target tools --parallel 2

      - name: Verify host tools
        run: |
          test -f build-host/strgen.cmake
          test -f build-host/settingsgen.cmake
          test -f build-host/src/strgen/strgen
          test -f build-host/src/settingsgen/settingsgen

          echo "Host tools and CMake exports verified."

      - name: Configure WebAssembly game
        run: |
          HOST_BUILD_DIR="$(realpath build-host)"

          emcmake cmake -S . -B build \
            -DHOST_BINARY_DIR="$HOST_BUILD_DIR" \
            -DCMAKE_BUILD_TYPE=Release \
            -DOPTION_USE_ASSERTS=OFF

      - name: Compile WebAssembly game
        run: |
          cmake --build build --target openttd --parallel 2

      - name: Assemble browser distribution
        run: |
          mkdir -p browser-dist

          cp build/openttd.html browser-dist/index.html
          cp build/openttd.js browser-dist/
          cp build/openttd.wasm browser-dist/
          cp build/openttd.data browser-dist/

          cat > browser-dist/README.txt <<'README'
          Rail & Empire - OpenTTD Browser Build

          Browser compilation of the OpenTTD engine.

          Serve the files together over HTTP or HTTPS.

          Original OpenTTD licensing requirements apply.
          README

      - name: Upload browser build
        uses: actions/upload-artifact@v7
        with:
          name: rail-empire-openttd-browser
          path: browser-dist/
          retention-days: 7
